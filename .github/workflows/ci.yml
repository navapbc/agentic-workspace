name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-checks:
    name: Enforce the kit's own invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep fd-find jq
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Shellcheck the kit scripts
        run: shellcheck scripts/*.sh

      # The support engine ships as runnable code, so it is linted at the same level its
      # own gate uses. Style/info suggestions do not fail a workspace gate, so they do not
      # fail here either.
      - name: Shellcheck the support engine
        run: |
          shellcheck -S warning \
            templates/support/tools/*.sh \
            templates/support/validation/*.sh \
            templates/support/validation/test/*.sh \
            templates/support/skills/*.sh

      - name: Regenerate the sandbox fixture
        run: ./scripts/seed-sandbox.sh

      - name: Sandbox must not drift (regenerate == committed)
        run: git diff --exit-code reference/sandbox

      - name: Validate the sandbox with the lightweight Crawl-phase checker
        run: ./scripts/validate-workspace.sh reference/sandbox

      # Run the engine's own gate against a COPY: its component suites plant and clean up
      # fixture files inside the workspace root, and a copy keeps the committed sandbox
      # byte-identical no matter what.
      - name: Run the support engine's own gate (on a copy)
        run: |
          cp -R reference/sandbox "$RUNNER_TEMP/sandbox-check"
          "$RUNNER_TEMP/sandbox-check/agentic-support/validation/check-workspace.sh"

      # install-support.sh --check must be a no-op against a freshly seeded sandbox:
      # if it reports a difference, the shipped engine and the installer disagree.
      - name: Installer must be idempotent
        run: |
          ./scripts/install-support.sh reference/sandbox --check
          git diff --exit-code reference/sandbox
