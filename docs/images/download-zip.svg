<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How to download the kit as a ZIP</title>
  <desc id="d">On the GitHub repo page, click the green Code button, stay on the Local tab, and choose Download ZIP at the bottom of the menu. No git or GitHub account needed.</desc>

  <!-- self-contained dark card so it reads on light or dark backgrounds -->
  <rect x="1" y="1" width="558" height="428" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- green Code button -->
  <rect x="386" y="20" width="150" height="40" rx="8" fill="#238636"/>
  <text x="410" y="45" fill="#ffffff" font-size="15" font-weight="600">&#60;&#62;</text>
  <text x="436" y="45" fill="#ffffff" font-size="15" font-weight="600">Code</text>
  <text x="508" y="45" fill="#ffffff" font-size="13">&#9662;</text>

  <!-- dropdown panel -->
  <rect x="24" y="78" width="512" height="330" rx="10" fill="#161b22" stroke="#30363d"/>

  <!-- tabs -->
  <text x="48" y="112" fill="#e6edf3" font-size="14" font-weight="600">Local</text>
  <rect x="46" y="122" width="42" height="2" fill="#f78166"/>
  <text x="112" y="112" fill="#8b949e" font-size="14">Codespaces</text>
  <line x1="24" y1="134" x2="536" y2="134" stroke="#30363d"/>

  <!-- clone label -->
  <text x="48" y="164" fill="#e6edf3" font-size="14" font-weight="600">Clone</text>

  <!-- segmented control -->
  <rect x="48" y="178" width="86" height="30" rx="6" fill="#21262d" stroke="#8b949e"/>
  <text x="64" y="198" fill="#e6edf3" font-size="13" font-weight="600">HTTPS</text>
  <text x="150" y="198" fill="#8b949e" font-size="13">SSH</text>
  <text x="200" y="198" fill="#8b949e" font-size="13">GitHub CLI</text>

  <!-- url field -->
  <rect x="48" y="218" width="440" height="32" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="239" fill="#8b949e" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://github.com/navapbc/agentic-workspace.git</text>

  <line x1="24" y1="272" x2="536" y2="272" stroke="#30363d"/>

  <!-- open with desktop row (muted) -->
  <text x="60" y="302" fill="#8b949e" font-size="13.5">Open with GitHub Desktop</text>

  <!-- Download ZIP row, highlighted -->
  <rect x="40" y="320" width="220" height="42" rx="8" fill="#1f6feb22" stroke="#f78166" stroke-width="2"/>
  <text x="60" y="346" fill="#e6edf3" font-size="14" font-weight="600">Download ZIP</text>

  <!-- callout -->
  <path d="M268 341 H320" stroke="#f78166" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#f78166"/>
    </marker>
  </defs>
  <text x="330" y="338" fill="#f78166" font-size="13" font-weight="600">Start here</text>
  <text x="330" y="356" fill="#8b949e" font-size="12">no git or GitHub</text>
  <text x="330" y="372" fill="#8b949e" font-size="12">account needed</text>
</svg>
