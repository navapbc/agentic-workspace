version: 1

# The discovery and availability authority. `skills/<id>/SKILL.md` is the source of truth
# for behavior; this file decides what exists and whether it is runnable. Add or remove an
# entry in the SAME change as its canonical skill — validation/check-workspace.sh fails on
# a mismatch in either direction.

source_of_truth: agentic-support/skills

skills:
  - id: workspace-setup
    path: workspace-setup/SKILL.md
    status: enabled
  - id: artifact-routing
    path: artifact-routing/SKILL.md
    status: enabled
  - id: repo-sync
    path: repo-sync/SKILL.md
    status: enabled
  - id: notice-change-brief
    path: notice-change-brief/SKILL.md
    status: enabled

targets:
  codex: ~/.agents/skills
  claude: ~/.claude/skills
  opencode: ~/.config/opencode/skills
