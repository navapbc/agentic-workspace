# Product-area registry (FICTIONAL SANDBOX).
#
# `agentic-support/tools/route-artifact.sh` reads this file, so an unregistered area gets
# a "stop and ask" instead of a guess. Exceptions are typed and carry a rationale, so an
# exception cannot outlive the situation that justified it.

areas:
  - id: benefits-notices
    profile: product:benefits-notices
    steward: Priya Anand (fictional)
    exceptions:
      - type: variance
        lanes: [docs/plans]
        rationale: Notice changes ship to real beneficiaries, so ideas graduate straight to a reviewed plan rather than resting in the ideation lane.
