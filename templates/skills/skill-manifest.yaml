schema_version: 1

# skills/<name>/ is the source of truth. Runtime copies are generated by sync-skills.sh
# and must not be edited directly. The `status` field lets you ship the structure
# before a skill is finished: mark it `paused` and it stays visible as reference.

# Path to the source-of-truth skills dir (this file's directory). Relative is fine.
source_of_truth: skills

skills:
  # Rename to your real skill. The directory under skills/ must match `name`.
  - name: example-skill
    version: 1.0.0
    status: enabled   # enabled | paused

# Where each harness expects runtime skill copies. Adjust to your machines.
targets:
  opencode: ~/.config/opencode/skills
  codex: ~/.agents/skills
  claude: ~/.claude/skills
