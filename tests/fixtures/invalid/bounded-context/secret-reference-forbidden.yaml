# SECRET_REFERENCE_FORBIDDEN -- the shared-tier prohibition applies here for the
# same reason it applies to an Org document: the tier is shared.
id: example-claims-context
kind: bounded-context
schema_version: 1
release: 1
identity:
  name: Example Claims Context
  purpose: What one analysis team needs in order to answer questions about claims intake.
organizations:
  - example-agency
extends:
  - id: example-agency
    release: 1
    location: file:documents/org/example-agency.yaml
systems:
  - ref: example-agency#claims-warehouse
    scope: not-established
outputs:
  roles:
    - analyst
  guidance: Read the view first.
  destination: file:views/example-claims-context
limitations:
  - "The warehouse credential is at vault://example-team/claims/read, which is where a new analyst should start."
access_failures: []
