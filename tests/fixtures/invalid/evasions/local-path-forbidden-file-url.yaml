# LOCAL_PATH_FORBIDDEN -- an absolute local path behind a URL scheme. The scheme makes it look like a location and changes nothing.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The archive lives at file:///Users/name/claims-archive for the team that maintains it."
