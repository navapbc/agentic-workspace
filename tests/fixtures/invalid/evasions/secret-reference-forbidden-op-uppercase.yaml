# SECRET_REFERENCE_FORBIDDEN -- the same scheme in upper case. A denylist that only knows one casing is a denylist with a documented bypass.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The value is at OP://Example-Vault/example-claims/credential for anyone who needs it."
