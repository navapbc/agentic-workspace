# SECRET_REFERENCE_FORBIDDEN -- a cloud secret store reference. It names a credential store from a tier that is shared, which is the whole prohibition.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The value is at arn:aws:secretsmanager:us-east-1:000000000000:secret:example for the job role."
