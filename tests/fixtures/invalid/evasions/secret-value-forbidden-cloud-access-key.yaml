# SECRET_VALUE_FORBIDDEN -- a cloud access key id. Half a credential is still a credential, and this half is the half that identifies the account.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The extract job runs as AKIAEXAMPLE0EXAMPLE0 until the platform office rotates it."
