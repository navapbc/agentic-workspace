# SECRET_VALUE_FORBIDDEN -- a password with a value behind it. Prose about passwords passes; an assignment long enough not to be a placeholder does not.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "The legacy client is configured with password=example0example0 in its own config."
