# SECRET_VALUE_FORBIDDEN -- the banner line of a private key, with no key material behind it. The banner alone is enough of a shape to reject, which is the point: nobody pastes one deliberately.
# An Org document is the carrier because both shared-tier denylists apply there.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "-----BEGIN OPENSSH PRIVATE KEY----- was pasted into this field by accident."
