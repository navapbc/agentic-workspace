# SECRET_REFERENCE_MALFORMED -- a literal value where a reference belongs. The
# tier's permission is to point at a secret, never to hold one, and the check is
# a grammar rather than an absence: "no check ran" and "the check passed" have
# to look different.
id: example-practitioner
kind: individual
schema_version: 1
bindings:
  - ref:
      id: example-claims-context
      release: 1
      location: file:documents/bounded-context/example-claims-context.yaml
    documents_root: /Users/name/context-fabric-documents
    framework_root: /Users/name/context-fabric
    output_root: /Users/name/context-fabric-documents/views
    harness:
      id: example-harness
    secrets:
      store: op
      account: example-account
      env:
        EXAMPLE_CLAIMS_TOKEN: hunter2
