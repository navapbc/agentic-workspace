# INTERFACE_URL_INSECURE -- a remote interface URL over plain HTTP. Loopback is
# the only exemption, and this host is not loopback.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - http://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations: []
