# KIND_UNKNOWN -- the document kind is outside the enum. `kind` is what tells a
# reader which contract to check the document against, so a near miss is a
# document nothing can classify.
id: example-agency
kind: organization
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations: []
