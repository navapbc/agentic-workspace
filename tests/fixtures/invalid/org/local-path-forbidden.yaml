# LOCAL_PATH_FORBIDDEN -- a path that resolves on one machine and nowhere else.
# Shared documents travel; this string is wrong for every reader but its author.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env: {}
        limitations:
          - "/Users/name/exports holds the extract this interface is compared against."
