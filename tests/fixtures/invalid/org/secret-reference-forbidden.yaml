# SECRET_REFERENCE_FORBIDDEN -- a vault reference in a shared tier. The
# reference carries no credential, which is exactly why it is tempting; it is
# still one machine's answer written into a document every reader shares.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: oauth
          env:
            EXAMPLE_CLAIMS_TOKEN: "Read it from op://Example-Vault/example-claims/credential before the call."
        limitations: []
