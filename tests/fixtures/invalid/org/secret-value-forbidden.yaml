# SECRET_VALUE_FORBIDDEN -- a credential-shaped token in a shared document. The
# token below is 36 zeros behind a real prefix: a shape, never a secret.
id: example-agency
kind: org
schema_version: 1
release: 1
organization:
  id: example-agency
  name: Example Agency
systems:
  - id: claims-warehouse
    name: Claims Warehouse
    kind: data-warehouse
    status: active
    interfaces:
      - id: read-api
        status: active
        type: rest
        urls:
          - https://api.example.invalid/claims/v1
        auth:
          method: api-key
          env: {}
        limitations:
          - "The extract job authenticates as ghp_000000000000000000000000000000000000 until the platform office rotates it."
